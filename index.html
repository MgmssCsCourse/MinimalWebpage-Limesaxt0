<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ich bins doch</title>
        <style>
            /* Macht die Seite auf Handy und PC gut lesbar */
            body {
                font-family: sans-serif;
                max-width: 650px;
                margin: 50px auto;
                padding: 20px;
                line-height: 1.6;
                color: #222;
            }
            .motto {
                color: #666;
                font-size: 1.2em;
            }
            footer {
                margin-top: 50px;
                font-size: 0.9em;
                color: #888;
            }
        </style>
    </head>
    <body>

        <!-- Titel der Webseite -->
        <h1>Ich bins doch</h1>

        <!-- Zweite, sekundäre Unterschrift oder Motto -->
        <p class="motto">Willkommen auf meiner eigenen GitHub-Seite.</p>

        <hr>

        <!-- Hauptbereich / Infos -->
        <h2>Über diese Seite</h2>
        <p>Hier findest du meine Projekte, Gedanken und alles, woran ich gerade arbeite.</p>

        <!-- Link zum eigenen GitHub-Profil -->
        <h2>Meine Links</h2>
        <ul>
            <li><a href="https://github.com">Mein GitHub-Profil</a></li>
        </ul>

        <!-- Fußzeile -->
        <footer>
            <p>Erstellt mit HTML & gehostet auf GitHub Pages.</p>
        </footer>

    </body>
</html>
